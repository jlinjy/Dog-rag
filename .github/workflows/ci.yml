name: Test Dog-RAG
run-name: ${{github.actor}} testing github actions with dog RAG
on: [push]
jobs:
  rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t dograg-web:ci .

  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r services/agent/requirements.txt

      - name: Run tests
        working-directory: services/agent
        run: pytest -v

      - name: Build Docker image
        run: docker build -f services/agent/Dockerfile -t dog-agent:ci .
