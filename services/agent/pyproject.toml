[project]
name = "dog-agent-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5,<2",
    "langchain-core>=1.8,<2",
    "langchain-ollama>=1.1,<2",
    "langgraph>=1.2,<2",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pandas",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
