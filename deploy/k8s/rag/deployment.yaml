apiVersion: apps/v1
kind: Deployment
metadata:
  name: dograg-web-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dograg-web
  template:
    metadata:
      labels:
        app: dograg-web
    spec: # start of container
      containers:
        - name: dograg-web
          image: dograg-web:v1
          env: 
          - name: DB_HOST
            value: "host.docker.internal" # Postgres via compose on the Mac
          - name: DB_PORT
            value: "5432"
          # Credentials come from the dograg-db Secret, which deploy/kind/up.sh
          # creates from .env, so no secret value lives in this file.
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: dograg-db
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: dograg-db
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: dograg-db
                key: DB_PASSWORD
          - name: OLLAMA_HOST
            value: "http://host.docker.internal:11434"
          ports:
          - containerPort: 80
          resources:
            requests: # minimum
              memory: "512Mi" #"256Mi" 
              cpu: "250m"
            limits: #maximum
              memory: "3Gi" # "256Mi" 
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            failureThreshold: 3