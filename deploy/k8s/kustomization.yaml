apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rag/deployment.yaml   # DB credentials come from the dograg-db Secret (created by deploy/kind/up.sh)
  - rag/service.yaml
  - agent/deployment.yaml
  - agent/service.yaml
  # entry point (needs Envoy Gateway installed first, see deploy/kind/up.sh)
  - gateway/envoyproxy.yaml
  - gateway/gatewayclass.yaml
  - gateway/gateway.yaml
  - gateway/httproute.yaml
  # - postgres/
