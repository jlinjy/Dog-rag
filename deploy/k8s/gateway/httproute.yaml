# Everything on the gateway goes to the agent (/chat, /health, /docs, /openapi.json).
# The RAG service is deliberately NOT routed: it stays internal, reachable only by the agent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dog-agent-route
spec:
  parentRefs:
    - name: dog-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dog-agent-svc
          port: 80
      timeouts:
        request: 180s   # Envoy's default is 15s; an agent turn (LLM + RAG) can take far longer
